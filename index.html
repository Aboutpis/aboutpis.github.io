(function(){
  var checking=false, current=58739;
  async function checkVersion(){
    if(checking || !document.querySelector('.homeScene'))return;
    checking=true;
    try{
      var url=new URL(location.href);
      url.searchParams.set('_version_check',String(Date.now()));

      if(!response.ok)return;
      var html=await response.text();
      var match=html.match(/id=["']appVersion["'][^>]*>RC5\.8\.7\.(\d+)/);

      var latest=58700+Number(match[1]);
      if(latest>current && document.querySelector('.homeScene')){
        var target=new URL(location.href);
        target.searchParams.delete('_version_check');
        target.searchParams.set('_app_version',String(latest));
        location.replace(target.toString());
      }
    }catch(e){/* Offline: keep working normally. */}
    finally{checking=false;}
  }
  window.addEventListener('pageshow',function(){setTimeout(checkVersion,1200);});
  window.addEventListener('focus',checkVersion);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checkVersion();});
  setInterval(checkVersion,60000);
})();</script><script src="theme-assets/village-v30/theme.js?v=58738"></script></body></html>
